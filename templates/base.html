<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobTrack</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary mb-4"><div class="container">
<a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">JobTrack</a>
<div class="d-flex gap-2 align-items-center text-white">{% if user.is_authenticated %}<span>{{ user.username }}</span>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Logout</button></form>
{% else %}<a class="btn btn-sm btn-outline-light" href="{% url 'login' %}">Login</a><a class="btn btn-sm btn-light" href="{% url 'register' %}">Register</a>{% endif %}</div>
</div></nav><main class="container pb-5">{% block content %}{% endblock %}</main></body></html>
