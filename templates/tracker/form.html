{% extends 'base.html' %}{% block content %}<div class="card mx-auto p-4" style="max-width:650px"><h2>{{ heading }}</h2><form method="post">{% csrf_token %}
{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
<div>{{ field }}</div>{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}
<button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">Cancel</a></form></div>
<style>input,select,textarea{max-width:100%;width:100%;padding:.4rem;border:1px solid #ccc;border-radius:5px}</style>{% endblock %}
